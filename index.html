<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispering Audio</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            /* Much wider margins: 15% on left/right, 60px top/bottom */
            padding: 60px 15%; 
            color: #000;
            /* Smaller base font size */
            font-size: 14px; 
        }
        .entry-container {
            max-width: 100%; /* Fill the available width */
            margin: 0 auto;
        }
        .entry {
            background-color: transparent;
            border: none;
            text-align: left;
            padding: 0;
            /* Slightly reduced gap to match smaller text scale, or keep 4.5em for dramatic spacing */
            margin-bottom: 4em; 
        }
        .info-block {
            margin-top: 12px;
            margin-bottom: 0.5em;
            line-height: 1.6; /* Slightly taller line height for readability */
        }
        audio {
            display: block;
            width: 100%;
            max-width: 400px; /* Player size unchanged, or reduce to 300px if desired */
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="entry-container">
        <!-- TEST ENTRY -->
        <div class="entry">
            <audio controls>
                <source src="fake-song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            
            <div class="info-block">
                <strong>Name:</strong> Test Song Title<br>
                <strong>Description:</strong> The text is now smaller and the site margins are much wider.
            </div>
        </div>
    </div>

</html>
