<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio List</title>
    <style>
        body {
            /* Light Grey Background */
            background-color: #f4f4f4;
            
            /* Simple monospace font stack */
            font-family: 'Courier New', Courier, monospace;
            
            /* General layout */
            margin: 0;
            padding: 40px;
            color: #000; /* Black text for maximum contrast */
        }

        .entry-container {
            /* Creates the column structure */
            max-width: 800px;
            margin: 0 auto;
        }

        .entry {
            /* Lighter Blue Background for the content blocks */
            background-color: #e3f2fd;
            
            /* Optional: Adds a subtle border to define the edges */
            border: 1px solid #bbdefb;
            
            /* Left justified text */
            text-align: left;
            
            /* Padding inside the blue box for breathing room */
            padding: 20px;
            
            /* Separated by 3 lines (approx 4.5em margin-bottom) */
            margin-bottom: 4.5em; 
        }

        .info-block {
            /* Ensures the name/description stays together above audio */
            margin-bottom: 0.5em;
            line-height: 1.5;
        }

        audio {
            /* Ensures the audio player is on its own line */
            display: block;
            margin-top: 10px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
