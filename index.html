<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whispering!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #00C3E1;
    font-family: 'Inter', sans-serif;
    font-size: 12pt;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 60px;
  }

  a { color: #00C3E1; text-decoration: none; }
  a:hover { opacity: 0.7; }

  .container {
    width: 100%;
    max-width: 720px;
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
  }

  .header .logo {
    font-size: 24px;
    font-style: italic;
    font-weight: 400;
    color: #00C3E1;
  }

  .filter-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0;
  }
  .filter-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: #00C3E1;
    border-radius: 1px;
  }

  .filter-menu {
    display: none;
    position: absolute;
    top: 32px;
    right: 0;
    background: #fff;
    border: 1px solid #00C3E1;
    border-radius: 8px;
    min-width: 160px;
    padding: 6px;
    z-index: 10;
  }
  .filter-menu.open { display: block; }
  .filter-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 12pt;
    border: none;
    background: none;
    color: #00C3E1;
    cursor: pointer;
    border-radius: 4px;
  }
  .filter-menu button:hover { background: #f0fafc; }
  .filter-menu button.active { font-weight: 700; }
  .filter-menu .divider {
    border-bottom: 0.5px solid #00C3E1;
    margin-bottom: 4px;
    padding-bottom: 8px;
  }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .track {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .track audio {
    width: 100%;
    height: 36px;
  }

  .track-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12pt;
    color: #00C3E1;
  }
  .track-title { font-weight: 500; }
  .track-artist { opacity: 0.7; }

  @media (max-width: 600px) {
    body { padding: 24px 16px 60px; }
    .container { max-width: 100%; }
    .header .logo { font-size: 20px; }
    .track-info { font-size: 11pt; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/" class="logo">whispering!</a>
    <button class="filter-btn" id="filterBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="filter-menu" id="filterMenu"></div>
  </div>
<div class="track-list" id="trackList"></div>
</div>

<script>
  const list = document.getElementById('trackList');
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  let currentFilter = 'all';
  let allTracks = [];

  const door = document.createElement('button');
  door.textContent = 'Doorway';
  door.style.fontWeight = '700';
  door.className = 'divider';
  door.addEventListener('click', () => { window.location.href = '/upload/'; });
  filterMenu.appendChild(door);

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => { filterMenu.classList.remove('open'); });
  filterMenu.addEventListener('click', (e) => { e.stopPropagation(); });

  function render(filter) {
    list.innerHTML = '';
    const filtered = filter === 'all' ? allTracks : allTracks.filter(t => (t.artist || t.user) === filter);
    filtered.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = t.src || t.audio;
      const info = document.createElement('div');
      info.className = 'track-info';
      info.innerHTML = `<span class="track-title">${t.title || t.name}</span><span class="track-artist">- ${t.artist || t.user}</span>`;
      row.appendChild(audio);
      row.appendChild(info);
      list.appendChild(row);
    });
  }

  function buildFilterMenu(tracks) {
    const artists = [...new Set(tracks.map(t => t.artist || t.user))].sort();
    const allBtn = document.createElement('button');
    allBtn.textContent = 'Voices';
    allBtn.dataset.filter = 'all';
    allBtn.classList.add('active');
    filterMenu.appendChild(allBtn);
    artists.forEach(a => {
      const btn = document.createElement('button');
      btn.textContent = a;
      btn.dataset.filter = a;
      filterMenu.appendChild(btn);
    });
  }

  filterMenu.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON' && e.target.dataset.filter) {
      currentFilter = e.target.dataset.filter;
      filterMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filterMenu.classList.remove('open');
      render(currentFilter);
    }
  });

  fetch('_data/songs.json')
    .then(r => { if (!r.ok) throw new Error('Network'); return r.json(); })
    .then(songs => {
      if (!songs || songs.length === 0) return;
      allTracks = songs;
      buildFilterMenu(songs);
      render('all');
    })
    .catch(err => console.error('Error:', err));
</script>
</body>
</html>
