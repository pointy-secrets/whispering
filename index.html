<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whispering!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ffffff;
  color: #00C3E1;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px 60px;
}

a { color: #00C3E1; text-decoration: none; }
a:hover { opacity: 0.7; }

.container {
  width: 100%;
  max-width: 720px;
  position: relative;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  position: relative;
}

.header .logo {
  font-size: 10pt;
  font-style: italic;
  font-weight: 200;
  color: #00C3E1;
}

.filter-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 0;
}
.filter-btn span {
  display: block;
  width: 18px;
  height: 1px;
  background: #00C3E1;
  border-radius: 1px;
}

.filter-menu {
  display: none;
  position: absolute;
  top: 32px;
  right: 0;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 8px;
  min-width: 160px;
  padding: 6px;
  z-index: 10;
}
.filter-menu.open { display: block; }
.filter-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 10px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  border: none;
  background: none;
  color: #00C3E1;
  cursor: pointer;
  border-radius: 4px;
}
.filter-menu button:hover { background: #f0fafc; }
.filter-menu button.active { color: #00C3E1; }
.filter-menu .divider {
  border-bottom: 0.5px solid #00C3E1;
  margin-bottom: 4px;
  padding-bottom: 8px;
}
.filter-menu .artist-item {
  padding-left: 16px;
}

.track-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.track {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.track audio {
  width: 300px;
  max-width: 100%;
  height: 36px;
}

.track-info {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
}
.track-title { font-weight: 200; }
.track-artist { opacity: 0.7; font-weight: 200; }

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 10pt;
  font-weight: 200;
  margin-bottom: 6px;
}
.form-group input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
  background: #ffffff;
}
.form-group input::placeholder { color: #00C3E1; opacity: 0.5; }

.drop-zone {
  border: 1px solid #00C3E1;
  border-radius: 8px;
  height: 180px;
  text-align: center;
  cursor: pointer;
  font-size: 10pt;
  font-weight: 200;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
}
.drop-zone .small-text {
  font-size: 9pt;
  opacity: 0.6;
}
.drop-zone.dragover { background: #f0fafc; }

button.submit-btn {
  width: 100%;
  padding: 10px;
  background: #00C3E1;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  cursor: pointer;
}
button.submit-btn:hover { opacity: 0.85; }
button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.status { margin-top: 12px; font-size: 10pt; font-weight: 200; }

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.page-title { font-size: 10pt; font-weight: 200; opacity: 0.7; }
select.filter-select {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  padding: 4px 8px;
}

.hairline { border: none; border-top: 1px solid rgba(0,195,225,0.25); margin: 12px 0; }

.song-list { display: flex; flex-direction: column; gap: 10px; }
.song-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 10pt;
  font-weight: 200;
}
.song-meta { opacity: 0.7; }
.delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 11pt;
  font-weight: 200;
  color: #00C3E1;
  padding: 2px 6px;
}
.delete-btn:hover { opacity: 0.6; }

.back-link { margin-top: 16px; font-size: 10pt; font-weight: 200; }

@media (max-width: 600px) {
  body { padding: 24px 16px 60px; }
  .container { max-width: 100%; }
  .header .logo { font-size: 10pt; }
}
@media (min-width: 1200px) {
  body { padding: 48px 24px 60px; }
}

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/" class="logo">whispering!</a>
    <button class="filter-btn" id="filterBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="filter-menu" id="filterMenu"></div>
  </div>
<div class="track-list" id="trackList"></div>
</div>

<script>
  const list = document.getElementById('trackList');
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  let currentFilter = 'all';
  let allTracks = [];

  const door = document.createElement('button');
  door.textContent = 'Doorway';
  door.className = 'divider';
  door.addEventListener('click', () => { window.location.href = '/upload/'; });
  filterMenu.appendChild(door);

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => { filterMenu.classList.remove('open'); });
  filterMenu.addEventListener('click', (e) => { e.stopPropagation(); });

  function render(filter) {
    list.innerHTML = '';
    const filtered = filter === 'all' ? allTracks : allTracks.filter(t => (t.artist || t.user) === filter);
    filtered.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = t.src || t.audio;
      const info = document.createElement('div');
      info.className = 'track-info';
      info.innerHTML = `<span class="track-title">${t.title || t.name}</span><span class="track-artist">- ${t.artist || t.user}</span>`;
      row.appendChild(audio);
      row.appendChild(info);
      list.appendChild(row);
    });
  }

  function buildFilterMenu(tracks) {
    const artists = [...new Set(tracks.map(t => t.artist || t.user))].sort();
    const allBtn = document.createElement('button');
    allBtn.textContent = 'Voices';
    allBtn.dataset.filter = 'all';
    allBtn.classList.add('active');
    filterMenu.appendChild(allBtn);
    artists.forEach(a => {
      const btn = document.createElement('button');
      btn.textContent = a;
      btn.dataset.filter = a;
      btn.classList.add('artist-item');
      filterMenu.appendChild(btn);
    });
  }

  filterMenu.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON' && e.target.dataset.filter) {
      currentFilter = e.target.dataset.filter;
      filterMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filterMenu.classList.remove('open');
      render(currentFilter);
    }
  });

  fetch('_data/songs.json')
    .then(r => { if (!r.ok) throw new Error('Network'); return r.json(); })
    .then(songs => {
      if (!songs || songs.length === 0) return;
      allTracks = songs;
      buildFilterMenu(songs);
      render('all');
    })
    .catch(err => console.error('Error:', err));
</script>
</body>
</html>
