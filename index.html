<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whispering!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ffffff;
  color: #00C3E1;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 10px 3px 40px 3px; /* top reduced, horizontal margins 3px */
}

a { color: #00C3E1; text-decoration: none; }
a:hover { opacity: 0.7; }

.container {
  width: 100%;
  position: relative;
}

/* Header blocks */
.logo-block,
.filter-btn-block {
  display: flex;
  align-items: center;
  justify-content: center;
  /* size will be set by content */
}
.logo-block {
  /* header text */
}
.logo-block .logo {
  font-size: var(--font-size-display);
  font-style: italic;
  font-weight: var(--font-weight-base);
  color: var(--color-primary);
  margin: 0;
}

/* Divider */
.divider-block {
  width: 100%;
  height: 1px;
  background: rgba(0,195,225,0.25);
  margin: 20px 0 0;
}

/* Track list container */
.tracks-block {
  /* content will be inserted via JS */
}

/* Base block styling for edit mode */
.block {
  position: relative;
  /* default margin */
  margin: 8px 0;
}
.block-content {
  /* inner content */
}

/* Edit mode specific styles */
.layout-edit-mode .block {
  border: 2px dashed rgba(0,195,225,0.3);
  border-radius: 4px;
  background: rgba(0,195,225,0.05);
}
.layout-edit-mode .block-content {
  padding: 8px;
}
.layout-edit-mode .resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 12px;
  height: 12px;
  background: rgba(0,195,225,0.5);
  cursor: se-resize;
  z-index: 2;
}
.layout-edit-mode .drag-handle {
  position: absolute;
  top: 0;
  left: 0;
  width: 12px;
  height: 12px;
  background: rgba(0,195,225,0.5);
  cursor: move;
  z-index: 2;
}
.layout-edit-mode .grid-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.layout-edit-mode .grid-overlay .grid-line {
  position: absolute;
  background: rgba(0,195,225,0.2);
}
.layout-edit-mode .grid-overlay .grid-line.v {
  width: 1px;
  height: 100%;
}
.layout-edit-mode .grid-overlay .grid-line.h {
  height: 1px;
  width: 100%;
}

/* Edit mode controls */
.layout-edit-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(0,0,0,0.7);
  color: #ffffff;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 9pt;
  z-index: 1000;
  display: none;
}
.layout-edit-mode .layout-edit-controls {
  display: block;
}
.layout-edit-controls button {
  background: #00C3E1;
  color: #ffffff;
  border: none;
  padding: 4px 8px;
  margin: 0 4px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 9pt;
}
.layout-edit-controls button:hover {
  opacity: 0.8;
}

/* ===== DESKTOP-ONLY OVERRIDES (min-width: 601px) ===== */
@media (min-width: 601px) {
  body {
    padding: 10px 3px 40px 3px; /* keep same horizontal */
  }
  .track audio {
    width: 400px;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  body { padding: 10px 3px 40px 3px; }
  .container { max-width: 100%; }
}
@media (min-width: 1200px) {
  body { padding: 10px 3px 40px 3px; }
}

/* Ensure the header elements display inline in normal mode */
.header-normal {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
</style>
</head>
<body class="whisper-body">

<div class="container">
  <div class="header-normal">
    <!-- Logo block -->
    <div class="block logo-block" data-block="logo">
      <div class="drag-handle"></div>
      <div class="block-content">
        <a href="/" class="logo">whispering!</a>
      </div>
      <div class="resize-handle"></div>
    </div>
    <!-- Filter button block -->
    <div class="block filter-btn-block" data-block="filter">
      <div class="drag-handle"></div>
      <div class="block-content">
        <button class="filter-btn" id="filterBtn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="filter-menu" id="filterMenu">
          <button id="uploadLink">upload recording</button>
        </div>
      </div>
      <div class="resize-handle"></div>
    </div>
  </div>

  <!-- Divider block -->
  <div class="block divider-block" data-block="divider">
    <div class="drag-handle"></div>
    <div class="block-content"></div>
    <div class="resize-handle"></div>
  </div>

  <!-- Track list block -->
  <div class="block tracks-block" data-block="tracks">
    <div class="drag-handle"></div>
    <div class="block-content" id="trackList"></div>
    <div class="resize-handle"></div>
  </div>
</div>

<!-- Edit mode controls (hidden by default) -->
<div class="layout-edit-controls" id="layoutControls">
  <button id="saveLayout">Save Layout</button>
  <button id="resetLayout">Reset Layout</button>
</div>

<script>
  window.addEventListener('error', (e) => {
    alert('Something went wrong. Please message mulu on Signal about this issue.');
    return false;
  });
  window.addEventListener('unhandledrejection', (e) => {
    alert('Something went wrong. Please message mulu on Signal about this issue.');
  });

  // Layout edit mode functionality
  const layoutControls = document.getElementById('layoutControls');
  const saveLayoutBtn = document.getElementById('saveLayout');
  const resetLayoutBtn = document.getElementById('resetLayout');
  
  // Check if we're in edit mode
  const urlParams = new URLSearchParams(window.location.search);
  const isEditMode = urlParams.get('layout') === 'edit';
  
  if (isEditMode) {
    document.body.classList.add('layout-edit-mode');
    layoutControls.style.display = 'block';
    initGridOverlay();
  }
  
  // Grid overlay
  function initGridOverlay() {
    const container = document.querySelector('.container');
    const overlay = document.createElement('div');
    overlay.className = 'grid-overlay';
    container.appendChild(overlay);
    updateGrid();
    window.addEventListener('resize', updateGrid);
  }
  
  function updateGrid() {
    const container = document.querySelector('.container');
    const overlay = container.querySelector('.grid-overlay');
    if (!overlay) return;
    overlay.innerHTML = '';
    const rect = container.getBoundingClientRect();
    const gridSize = 20; // 20px grid
    const cols = Math.ceil(rect.width / gridSize);
    const rows = Math.ceil(rect.height / gridSize);
    for (let i = 0; i <= cols; i++) {
      const line = document.createElement('div');
      line.className = 'grid-line v';
      line.style.left = (i * gridSize) + 'px';
      overlay.appendChild(line);
    }
    for (let i = 0; i <= rows; i++) {
      const line = document.createElement('div');
      line.className = 'grid-line h';
      line.style.top = (i * gridSize) + 'px';
      overlay.appendChild(line);
    }
  }
  
  // Snap value to grid
  function snapToGrid(value, gridSize = 20) {
    return Math.round(value / gridSize) * gridSize;
  }
  
  // Make blocks draggable and resizable
  function initInteractions() {
    const blocks = document.querySelectorAll('.block');
    blocks.forEach(block => {
      // Make draggable
      block.setAttribute('draggable', 'true');
      
      block.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', block.dataset.block);
        block.classList.add('dragging');
      });
      
      block.addEventListener('dragend', () => {
        block.classList.remove('dragging');
      });
      
      block.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(block.parentNode, e.clientY);
        if (afterElement == null) {
          block.parentNode.appendChild(block);
        } else {
          block.parentNode.insertBefore(block, afterElement);
        }
        // Snap to grid after drop
        requestAnimationFrame(() => snapBlockToGrid(block));
      });
      
      // Resize handle
      const resizeHandle = block.querySelector('.resize-handle');
      const dragHandle = block.querySelector('.drag-handle');
      let resizing = false;
      let startX, startY, startWidth, startHeight;
      
      resizeHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        resizing = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = block.getBoundingClientRect();
        startWidth = rect.width;
        startHeight = rect.height;
        document.body.style.cursor = 'se-resize';
        block.classList.add('resizing');
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!resizing) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        let newWidth = startWidth + dx;
        let newHeight = startHeight + dy;
        // Minimum size
        newWidth = Math.max(40, newWidth);
        newHeight = Math.max(40, newHeight);
        // Snap to grid
        newWidth = snapToGrid(newWidth);
        newHeight = snapToGrid(newHeight);
        block.style.width = newWidth + 'px';
        block.style.height = newHeight + 'px';
      });
      
      document.addEventListener('mouseup', (e) => {
        if (resizing) {
          resizing = false;
          document.body.style.cursor = 'default';
          block.classList.remove('resizing');
        }
      });
      
      // Drag handle for moving (optional, but we already have dragstart on block)
      // We'll also allow dragging from the drag handle area for clarity
      dragHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        // Trigger dragstart on the block
        block.dispatchEvent(new Event('dragstart'));
      });
    });
  }
  
  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.block:not(.dragging)')];
    
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }
  
  function snapBlockToGrid(block) {
    const rect = block.getBoundingClientRect();
    const container = document.querySelector('.container');
    const containerRect = container.getBoundingClientRect();
    const gridSize = 20;
    
    // Snap position
    let newLeft = rect.left - containerRect.left;
    let newTop = rect.top - containerRect.top;
    newLeft = snapToGrid(newLeft, gridSize);
    newTop = snapToGrid(newTop, gridSize);
    
    // Apply
    block.style.left = newLeft + 'px';
    block.style.top = newTop + 'px';
    
    // Ensure size is snapped (already done during resize, but just in case)
    let width = rect.width;
    let height = rect.height;
    width = snapToGrid(width, gridSize);
    height = snapToGrid(height, gridSize);
    block.style.width = width + 'px';
    block.style.height = height + 'px';
  }
  
  // Save layout to localStorage
  function saveLayout() {
    const order = [];
    document.querySelectorAll('.block').forEach(block => {
      order.push(block.dataset.block);
    });
    localStorage.setItem('whisperingLayout', JSON.stringify(order));
    // Also save positions and sizes? For simplicity, we only save order.
    // For a more advanced version, we could save rects.
    alert('Layout saved! Refresh to see changes.');
  }
  
  // Load layout from localStorage (order only)
  function loadLayout() {
    const saved = localStorage.getItem('whisperingLayout');
    if (saved) {
      const order = JSON.parse(saved);
      const container = document.querySelector('.container');
      order.forEach(blockType => {
        const block = document.querySelector(`.block[data-block="${blockType}"]`);
        if (block && block.parentNode !== container) {
          container.appendChild(block);
        }
      });
    }
  }
  
  // Reset layout to default
  function resetLayout() {
    localStorage.removeItem('whisperingLayout');
    localStorage.removeItem('whisperingBlockStates'); // if we saved states
    alert('Layout reset to default. Refresh to see changes.');
    window.location.reload();
  }
  
  // Event listeners
  saveLayoutBtn.addEventListener('click', saveLayout);
  resetLayoutBtn.addEventListener('click', resetLayout);
  
  // Initialize
  if (isEditMode) {
    initInteractions();
  } else {
    // On normal view, apply saved layout if exists
    loadLayout();
  }
  
  // Existing audio player JS (unchanged)
  const list = document.getElementById('trackList');
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  let currentFilter = 'all';
  let allTracks = [];

  const door = document.createElement('button');
  door.textContent = 'Doorway';
  door.className = 'divider';
  door.addEventListener('click', () => { window.location.href = '/upload/'; });
  filterMenu.appendChild(door);

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => { filterMenu.classList.remove('open'); });
  filterMenu.addEventListener('click', (e) => { e.stopPropagation(); });

  function render(filter) {
    list.innerHTML = '';
    const filtered = filter === 'all' ? allTracks : allTracks.filter(t => (t.artist || t.user) === filter);
    filtered.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = t.src || t.audio;
      const info = document.createElement('div');
      info.className = 'track-info';
      info.innerHTML = `<span class=\"track-title\">${t.title || t.name}</span><span class=\"track-artist\">${t.artist || t.user}</span>`;
      row.appendChild(audio);
      row.appendChild(info);
      list.appendChild(row);
    });
  }

  function buildFilterMenu(tracks) {
    const artists = [...new Set(tracks.map(t => t.artist || t.user))].sort();
    const allBtn = document.createElement('button');
    allBtn.textContent = 'Voices';
    allBtn.dataset.filter = 'all';
    allBtn.classList.add('active');
    filterMenu.appendChild(allBtn);
    artists.forEach(a => {
      const btn = document.createElement('button');
      btn.textContent = a;
      btn.dataset.filter = a;
      btn.classList.add('artist-item');
      filterMenu.appendChild(btn);
    });
  }

  filterMenu.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON' && e.target.dataset.filter) {
      currentFilter = e.target.dataset.filter;
      filterMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filterMenu.classList.remove('open');
      render(currentFilter);
    }
  });

  fetch('_data/songs.json')
    .then(r => { if (!r.ok) throw new Error('Network'); return r.json(); })
    .then(songs => {
      if (!songs || songs.length === 0) return;
      allTracks = songs;
      buildFilterMenu(songs);
      render('all');
    })
    .catch(err => console.error('Error:', err));
</script>
</body>
</html>
