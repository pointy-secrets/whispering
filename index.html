<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grass Labrynth</title>
    <style>
        body {
            /* Solid White Background */
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 60px 15%; 
            font-size: 14px; 
            min-height: 100vh;
        }
        .entry-container {
            max-width: 100%;
            margin: 0 auto;
        }
        .entry {
            background-color: transparent;
            border: none;
            text-align: left;
            padding: 0;
            margin-bottom: 4em; 
        }
        .info-block {
            margin-top: 12px;
            margin-bottom: 0.5em;
            line-height: 1.6;
            /* Two-column layout using Flexbox */
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .label {
            color: #000000; /* Black */
            font-weight: normal;
            text-transform: lowercase;
            width: 40px; /* Fixed width for column alignment */
            flex-shrink: 0;
        }
        .content {
            color: #000000;
            flex-grow: 1;
        }
        audio {
            display: block;
            width: 100%;
            max-width: 400px;
            margin-bottom: 0;
            /* 60% Translucency (40% opacity) */
            opacity: 0.4; 
        }
    </style>
</head>
<body>

    <div class="entry-container">
        <!-- HARDCODED DUMMY ENTRY -->
        <div class="entry">
            <audio controls>
                <source src="fake-song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="info-block">
                <div class="row">
                    <span class="label">what</span>
                    <span class="content">Dummy Track Title</span>
                </div>
                <div class="row">
                    <span class="label">who</span>
                    <span class="content">Dummy User Name</span>
                </div>
            </div>
        </div>
    </div>

    <div id="song-list"></div>

    <script>
        fetch('_data/songs.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(songs => {
                const container = document.getElementById('song-list');
                container.innerHTML = '';
                
                if (!songs || songs.length === 0) {
                    return;
                }

                songs.reverse().forEach(song => {
                    const entry = document.createElement('div');
                    entry.className = 'entry';
                    entry.innerHTML = `
                        <audio controls>
                            <source src="${song.audio}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                        <div class="info-block">
                            <div class="row">
                                <span class="label">what</span>
                                <span class="content">${song.name}</span>
                            </div>
                            <div class="row">
                                <span class="label">who</span>
                                <span class="content">${song.user}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(entry);
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    </script>
</body>
</html>
