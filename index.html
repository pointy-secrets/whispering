<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grass Labrynth</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 60px 15%; 
            font-size: 14px; 
            min-height: 100vh;
        }
        .entry-container {
            max-width: 100%;
            margin: 0 auto;
        }
        .entry {
            background-color: transparent;
            border: none;
            text-align: left;
            padding: 0;
            margin-bottom: 4em; 
        }
        .info-block {
            margin-top: 12px;
            margin-bottom: 0.5em;
            line-height: 1.6;
        }
        audio {
            display: block;
            width: 100%;
            max-width: 400px;
            margin-bottom: 0;
        }
        .label {
            color: #888888;
            font-weight: normal;
            text-transform: lowercase;
        }
        .content {
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="entry-container">
        <!-- HARDCODED DUMMY ENTRY -->
        <div class="entry">
            <audio controls>
                <source src="fake-song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="info-block">
                <span class="label">what:</span> <span class="content">Dummy Track Title</span><br>
                <span class="label">who:</span> <span class="content">Dummy User Name</span>
            </div>
        </div>
    </div>

    <!-- Script removed temporarily to test basic HTML -->

</body>
</html>
