<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispering Audio</title>
    <style>
        body {
            /* White Background */
            background-color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
            color: #000;
        }
        .entry-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .entry {
            /* No background color, no border */
            background-color: transparent;
            border: none;
            text-align: left;
            padding: 0; /* Removed internal padding */
            margin-bottom: 4.5em; /* Kept the 3-line separation */
        }
        .info-block {
            margin-top: 10px; /* Space between player and text */
            margin-bottom: 0.5em;           }
    </style>
</head>
<body>

    <div class="entry-container">
        <!-- HARDCODED TEST ENTRY -->
        <div class="entry">
            <div class="info-block">
                <strong>Name:</strong> Test Song Title<br>
                <strong>Description:</strong> If you can see this blue box, your design is working perfectly!
            </div>
            <!-- Dummy audio player (won't play sound but shows the UI) -->
            <audio controls>
                <source src="fake-song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        <!-- END TEST ENTRY -->
    </div>

</body>
</html>
