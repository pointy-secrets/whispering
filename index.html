<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispering Audio</title>
    <style>
        body {
            /* White Background */
            background-color: #ffffff;
            /* Remove any background image */
            background-image: none;
            
            /* Black Text */
            color: #000000;
            
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 60px 15%; 
            font-size: 14px; 
            min-height: 100vh;
        }
        .entry-container {
            max-width: 100%;
            margin: 0 auto;
        }
        .entry {
            background-color: transparent;
            border: none;
            text-align: left;
            padding: 0;
            margin-bottom: 4em; 
        }
        .info-block {
            margin-top: 12px;
            margin-bottom: 0.5em;
            line-height: 1.6;
        }
        audio {
            display: block;
            width: 100%;
            max-width: 400px;
            margin-bottom: 0;
        }
        strong {
            /* Ensure labels are black */
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="entry-container">
        <div class="entry">
            <audio controls>
                <source src="fake-song.mp3" type="audio/mpeg">
            </audio>
            
            <div class="info-block">
                <strong>Track Name:</strong> Test Song Title<br>
                <strong>User:</strong> The text is now black on a white background.
            </div>
        </div>
    </div>

</body>
</html>
