<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whispers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #00C3E1;
    font-family: 'Inter', sans-serif;
    font-size: 5pt;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  a {
    color: #00C3E1;
    text-decoration: none;
  }
  a:hover { opacity: 0.7; }

  .container {
    width: 100%;
    max-width: 380px;
    position: relative;
  }

  .header {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    font-size: 11px;
    color: #00C3E1;
    width: 100%;
    display: flex;
    justify-content: space-between;
  }

  .header a {
    font-size: 11px;
    color: #00C3E1;
  }

  .header .active {
    font-weight: 400;
  }

  /* hamburger filter */
  .filter-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0;
  }

  .filter-btn span {
    display: block;
    width: 14px;
    height: 1.5px;
    background: #00C3E1;
    border-radius: 1px;
    transition: all 0.15s;
  }

  .filter-btn:hover span {
    opacity: 0.7;
  }

  .filter-menu {
    display: none;
    position: absolute;
    top: 32px;
    right: 0;
    background: #fff;
    border: 1px solid #00C3E1;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,195,225,0.08);
    min-width: 120px;
    padding: 4px;
    z-index: 10;
  }

  .filter-menu.open { display: block; }

  .filter-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 5pt;
    border: none;
    background: none;
    color: #00C3E1;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.1s;
  }

  .filter-menu button:hover { background: #f0fafc; }
  .filter-menu button.active { font-weight: 700; }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .track {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .track audio {
    width: 100%;
    height: 32px;
  }

  /* Style native audio controls to be cyan */
  audio::-webkit-media-controls-panel { background: #fff; }
  audio::-webkit-media-controls-play-button { 
    border-radius: 50%;
    color: #00C3E1;
  }
  audio::-webkit-media-controls-current-time-display { color: #00C3E1; font-size: 5pt; }
  audio::-webkit-media-controls-time-remaining-display { color: #00C3E1; font-size: 5pt; }
  audio::-webkit-media-controls-timeline { color: #00C3E1; }
  audio::-webkit-media-controls-volume-slider { color: #00C3E1; }

  .track-info {
    font-size: 5pt;
    line-height: 1.4;
    color: #00C3E1;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .track-title { font-weight: 500; }
  .track-artist { opacity: 0.7; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/" class="active" style="font-style:italic;font-weight:400">whispering!</a>
    <button class="filter-btn" id="filterBtn" aria-label="Filter by artist">
      <span></span><span></span><span></span>
    </button>
    <div class="filter-menu" id="filterMenu"></div>
  </div>

  <div class="track-list" id="trackList"></div>
</div>

<script>
  const list = document.getElementById('trackList');
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  let currentFilter = 'all';
  let allTracks = [];

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle('open');
  });

  document.addEventListener('click', () => {
    filterMenu.classList.remove('open');
  });

  filterMenu.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      currentFilter = e.target.dataset.filter;
      filterMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filterMenu.classList.remove('open');
      render(currentFilter);
    }
  });

  function render(filter) {
    list.innerHTML = '';
    const filtered = filter === 'all' ? allTracks : allTracks.filter(t => (t.artist || t.user) === filter);
    filtered.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track';

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = t.src || t.audio;

      const info = document.createElement('div');
      info.className = 'track-info';
      info.innerHTML = `<span class="track-title">${t.title || t.name}</span><span class="track-artist">${t.artist || t.user}</span>`;

      row.appendChild(audio);
      row.appendChild(info);
      list.appendChild(row);
    });
  }

  function buildFilterMenu(tracks) {
    filterMenu.innerHTML = '';
    // doorway link at top
    const door = document.createElement('button');
    door.textContent = 'The Courtyard';
    door.style.fontWeight = '700';
    door.style.borderBottom = '0.5px solid #00C3E1';
    door.style.marginBottom = '4px';
    door.style.paddingBottom = '8px';
    door.style.borderRadius = '0';
    door.addEventListener('click', () => { window.location.href = '/upload/'; });
    filterMenu.appendChild(door);
    // artist filters
    const artists = [...new Set(tracks.map(t => t.artist || t.user))].sort();
    const allBtn = document.createElement('button');
    allBtn.textContent = 'The whisperers';
    allBtn.dataset.filter = 'all';
    allBtn.classList.add('active');
    filterMenu.appendChild(allBtn);
    artists.forEach(a => {
      const btn = document.createElement('button');
      btn.textContent = a;
      btn.dataset.filter = a;
      filterMenu.appendChild(btn);
    });
  }

  fetch('_data/songs.json')
    .then(r => {
      if (!r.ok) throw new Error('Network response was not ok');
      return r.json();
    })
    .then(songs => {
      if (!songs || songs.length === 0) return;
      allTracks = songs;
      buildFilterMenu(songs);
      render('all');
    })
    .catch(err => console.error('Error:', err));
</script>
</body>
</html>
