<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{title}</title>
  <style>
    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace; /* Matches MP3 page */
      font-size: 14px; /* Matches MP3 page */
      overflow: hidden;
    }
    /* The Input Field */
    #staticrypt-password {
      background: transparent;
      border: none;
      outline: none;
      color: #000000;
      font-family: 'Courier New', Courier, monospace; /* Matches MP3 page */
      font-size: 14px; /* Matches MP3 page */
      text-align: center;
      width: 20px;
      caret-color: #000;
      padding: 0;
      margin: 0;
    }
    /* Hide instructions, buttons, and the placeholder text */
    .staticrypt-instructions, 
    .staticrypt-button, 
    .staticrypt-remember, 
    .staticrypt-footer,
    .staticrypt-placeholder,
    form {
      display: none; /* Completely hides the form structure */
    }
    /* CRITICAL: Hide the encrypted content placeholder text until unlocked */
    #staticrypt-content {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Only the input field is visible -->
  <form id="staticrypt-form" action="#" method="post">
    <input id="staticrypt-password" type="password" name="password" placeholder="" autofocus autocomplete="off" />
  </form>
  
  <!-- The script handles decryption -->
  <script>
    // StatiCrypt logic injected here
  </script>
  
  <!-- This tag MUST exist for encryption, but CSS hides it until unlocked -->
  <div id="staticrypt-content">{encrypted_content}</div>
</body>
</html>
