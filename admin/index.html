<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Correct Syntax for StatiCrypt 3.x -->
  <title>/*[ template_title ]*/</title>
  <style>
    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow: hidden;
    }
    #staticrypt-password {
      background: transparent;
      border: none;
      outline: none;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      text-align: center;
      width: 20px;
      caret-color: #000;
      padding: 0;
      margin: 0;
    }
    /* Hide everything else */
    .staticrypt-instructions, 
    .staticrypt-button, 
    .staticrypt-remember, 
    .staticrypt-footer,
    form {
      display: none;
    }
    /* Hide the encrypted content container until unlocked */
    #staticrypt-content {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Only the input field is visible -->
  <form id="staticrypt-form" action="#" method="post">
    <input id="staticrypt-password" type="password" name="password" placeholder="" autofocus autocomplete="off" />
  </form>
  
  <!-- The script handles decryption -->
  <script>
    // StatiCrypt logic injected here automatically
  </script>
  
  <!-- CRITICAL: Use the correct comment syntax for encrypted content -->
  <div id="staticrypt-content">/*[ encrypted_content ]*/</div>
</body>
</html>
