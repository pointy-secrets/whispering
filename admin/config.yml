backend:
  name: github
  repo: pointy-secrets/whispering
  branch: main
  # Use the FULL URL to the auth endpoint directly here
  auth_endpoint: https://grass-labrynth-auth.yip-3e3.workers.dev/auth
  
  # OR, if that fails, try splitting them (ensure no trailing slash on base_url):
  # base_url: https://grass-labrynth-auth.yip-3e3.workers.dev
  # auth_endpoint: /auth

media_folder: "assets/music"
public_folder: "/assets/music"

collections:
  - name: "songs"
    label: "Songs"
    folder: "_data/songs"
    create: true
    fields:
      - { label: "Track Name (What)", name: "name", widget: "string" }
      - { label: "User (Who)", name: "user", widget: "string" }
      - { label: "Audio File", name: "audio", widget: "file", media_types: ["audio/mpeg"] }   
