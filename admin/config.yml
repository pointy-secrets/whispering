backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Add track {{slug}}"
    update: "Update track {{slug}}"
    delete: "Delete track {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

media_folder: "assets/music"
public_folder: "/assets/music"

collections:
  - name: "songs"
    label: "Songs"
    folder: "_data/songs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Track Name (What)", name: "name", widget: "string" }
      - { label: "User (Who)", name: "user", widget: "string" }
      - { label: "Audio File", name: "audio", widget: "file", media_types: ["audio/mpeg"] }   
