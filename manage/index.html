<!DOCTYPE html>
<html lang="en">
<head>
<style>
/* WHISPERING-GENERATED — do not hand-edit; edit tooling/_design/tokens.json instead */
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html { height: 100%; }

body {
  background: #ffffff;
  color: #00C3E1;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: clamp(24px, 4vw, 48px) clamp(16px, 5vw, 80px) 40px;
  overflow-x: clip;
}

a { color: #00C3E1; text-decoration: none; }
a:hover { opacity: 0.7; }

.container {
  width: 100%;
  max-width: 100%;
  margin-inline: auto;
  position: relative;
}

.header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  column-gap: 24px;
  row-gap: 12px;
  margin-bottom: clamp(16px, 3vw, 20px);
  position: relative;
}

.header .logo {
  font-size: clamp(36px, 11vw, 100px);
  font-style: italic;
  font-weight: 200;
  color: #00C3E1;
  line-height: 0.95;
  max-width: 100%;
  overflow-wrap: anywhere;
}

/* Full-width hairline under the logo */
.logo-rule {
  width: 100%;
  border: none;
  border-top: 1px solid rgba(0,195,225,0.25);
  margin: clamp(16px, 3vw, 20px) 0 0;
}

.filter-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 0;
  flex-shrink: 0;
}
.filter-btn span {
  display: block;
  width: 18px;
  height: 1px;
  background: #00C3E1;
  border-radius: 1px;
}

.filter-menu {
  display: none;
  position: absolute;
  top: 32px;
  right: 0;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 8px;
  min-width: 160px;
  max-width: min(280px, calc(100vw - 32px));
  padding: 6px;
  z-index: 10;
}
.filter-menu.open { display: block; }
.filter-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 10px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  border: none;
  background: none;
  color: #00C3E1;
  cursor: pointer;
  border-radius: 4px;
}
.filter-menu button:hover { background: #f0fafc; }
.filter-menu button.active { color: #00C3E1; }
.filter-menu .divider {
  border-bottom: 0.5px solid #00C3E1;
  margin-bottom: 4px;
  padding-bottom: 8px;
}
.filter-menu .artist-item {
  padding-left: 28px;
}

.track-list {
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 2vw, 16px);
  padding-top: clamp(28px, 5vw, 54px);
  width: 100%;
}

.track {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.track audio {
  width: 100%;
  min-width: min(300px, 100%);
  max-width: 100%;
  height: 36px;
}

.track-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 10px;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.track-title { font-weight: 200; }
.track-artist { opacity: 0.7; font-weight: 200; }

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 10pt;
  font-weight: 200;
  margin-bottom: 6px;
}
.form-group input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
  background: #ffffff;
}
.form-group input::placeholder { color: #00C3E1; opacity: 0.5; }

.drop-zone {
  border: 1px solid #00C3E1;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-size: 10pt;
  font-weight: 200;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1 / 1;
  height: auto;
}
.drop-zone .small-text {
  font-size: 9pt;
  opacity: 0.6;
}
.drop-zone.dragover { background: #f0fafc; }

button.submit-btn {
  width: 100%;
  padding: 10px;
  background: #00C3E1;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  cursor: pointer;
}
button.submit-btn:hover { opacity: 0.85; }
button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.status { margin-top: 12px; font-size: 10pt; font-weight: 200; }

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.page-title { font-size: 10pt; font-weight: 200; opacity: 0.7; }
select.filter-select {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 10pt;
  font-weight: 200;
  color: #00C3E1;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  padding: 4px 8px;
}

.hairline { border: none; border-top: 1px solid rgba(0,195,225,0.25); margin: 12px 0; }

.song-list { display: flex; flex-direction: column; gap: 10px; }
.song-item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 10pt;
  font-weight: 200;
  min-width: 0;
}
.song-meta { opacity: 0.7; min-width: 0; overflow-wrap: anywhere; }
.delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 11pt;
  font-weight: 200;
  color: #00C3E1;
  padding: 2px 6px;
  flex-shrink: 0;
}
.delete-btn:hover { opacity: 0.6; }

.back-link { margin-top: 16px; font-size: 10pt; font-weight: 200; }
</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whispering! — deletion page</title>
<style>
/* WHISPERING-PAGE-SPECIFIC — manage/ overrides; survives apply_tokens (no generated sentinel) */
body {
  align-items: center;
  padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 40px) 60px;
}
.container {
  max-width: 720px;
}
.header .logo {
  font-size: 10pt;
  line-height: 1.5;
}
.filter-menu .artist-item {
  padding-left: 16px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="/" class="logo">whispering!</a>
    <button class="filter-btn" id="filterBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="filter-menu" id="filterMenu">
      <button id="uploadLink">upload recording</button>
    </div>
  </div>

<hr class="logo-rule">

  <div class="song-list" id="songList"></div>
  <div class="status" id="status"></div>
</div>

<script>

  window.addEventListener('error', (e) => {
    alert('Something went wrong. Please message mulu on Signal about this issue.');
    return false;
  });
  window.addEventListener('unhandledrejection', (e) => {
    alert('Something went wrong. Please message mulu on Signal about this issue.');
  });

  const TOKEN = sessionStorage.getItem('whisper_token');
  if (!TOKEN) { window.location.href = '/upload/'; }
  const REPO_OWNER = 'pointy-secrets';
  const REPO_NAME = 'whispering';
  const BRANCH = 'main';
  const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  filterBtn.addEventListener('click', (e) => { e.stopPropagation(); filterMenu.classList.toggle('open'); });
  document.addEventListener('click', () => filterMenu.classList.remove('open'));
  filterMenu.addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('uploadLink').addEventListener('click', () => { window.location.href = '/upload/'; });

  const songListEl = document.getElementById('songList');
  const statusEl = document.getElementById('status');
  let allSongs = [];
  let songsSha = null;

  function toBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

  async function loadSongs() {
    try {
      const res = await fetch(`${API}/_data/songs.json`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
      if (!res.ok) throw new Error('failed to fetch');
      const data = await res.json();
      songsSha = data.sha;
      allSongs = JSON.parse(atob(data.content));
      renderSongs();
    } catch (e) {
      statusEl.textContent = 'could not load: ' + e.message;
    }
  }

  function renderSongs() {
    songListEl.innerHTML = '';
    allSongs.forEach((song, idx) => {
      const item = document.createElement('div');
      item.className = 'song-item';
      const meta = document.createElement('span');
      meta.className = 'song-meta';
      meta.textContent = `${song.title || song.name} — ${song.artist || song.user}`;
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.addEventListener('click', () => deleteSong(idx, song));
      item.appendChild(meta);
      item.appendChild(del);
      songListEl.appendChild(item);
    });
  }

  async function deleteSong(idx, song) {
    if (!confirm(`delete "${song.title || song.name}"?`)) return;
    try {
      statusEl.textContent = 'deleting...';
      const path = (song.src || '').replace(/^\//, '');
      if (path) {
        const fileRes = await fetch(`${API}/${path}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          await fetch(`${API}/${path}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'delete audio', sha: fileData.sha, branch: BRANCH })
          });
        }
      }
      allSongs.splice(idx, 1);
      const newContent = toBase64(JSON.stringify(allSongs, null, 2));
      const jsonRes = await fetch(`${API}/_data/songs.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'remove from list', content: newContent, sha: songsSha, branch: BRANCH })
      });
      if (!jsonRes.ok) throw new Error('failed to update list');
      const jsonData = await jsonRes.json();
      songsSha = jsonData.sha;
      statusEl.textContent = 'deleted';
      renderSongs();
    } catch (e) {
      statusEl.textContent = 'delete failed: ' + e.message;
    }
  }

  loadSongs();
</script>
</body>
</html>
