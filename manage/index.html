<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whispering! — deletion page</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ffffff;
  color: #00C3E1;
  font-family: 'Inter', sans-serif;
  font-size: 12pt;
  font-weight: 300;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px 60px;
}

a { color: #00C3E1; text-decoration: none; }
a:hover { opacity: 0.7; }

.container {
  width: 100%;
  max-width: 720px;
  position: relative;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  position: relative;
}

.header .logo {
  font-size: 24px;
  font-style: italic;
  font-weight: 300;
  color: #00C3E1;
}

.filter-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 0;
}
.filter-btn span {
  display: block;
  width: 18px;
  height: 2px;
  background: #00C3E1;
  border-radius: 1px;
}

.filter-menu {
  display: none;
  position: absolute;
  top: 32px;
  right: 0;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 8px;
  min-width: 160px;
  padding: 6px;
  z-index: 10;
}
.filter-menu.open { display: block; }
.filter-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 10pt;
  font-weight: 300;
  border: none;
  background: none;
  color: #00C3E1;
  cursor: pointer;
  border-radius: 4px;
}
.filter-menu button:hover { background: #f0fafc; }
.filter-menu button.active { color: #00C3E1; }
.filter-menu .divider {
  border-bottom: 0.5px solid #00C3E1;
  margin-bottom: 4px;
  padding-bottom: 8px;
}

.track-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.track {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.track audio {
  width: 300px;
  max-width: 100%;
  height: 36px;
}

.track-info {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 12pt;
  font-weight: 300;
  color: #00C3E1;
}
.track-title { font-weight: 300; }
.track-artist { opacity: 0.7; font-weight: 300; }

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12pt;
  font-weight: 300;
  margin-bottom: 6px;
}
.form-group input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 12pt;
  font-weight: 300;
  color: #00C3E1;
  background: #ffffff;
}
.form-group input::placeholder { color: #00C3E1; opacity: 0.5; }

.drop-zone {
  border: 1px solid #00C3E1;
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  font-size: 12pt;
  font-weight: 300;
  margin-bottom: 16px;
}
.drop-zone.dragover { background: #f0fafc; }

button.submit-btn {
  width: 100%;
  padding: 10px;
  background: #00C3E1;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 12pt;
  font-weight: 300;
  cursor: pointer;
}
button.submit-btn:hover { opacity: 0.85; }
button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.status { margin-top: 12px; font-size: 12pt; font-weight: 300; }

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.page-title { font-size: 12pt; font-weight: 300; opacity: 0.7; }
select.filter-select {
  font-family: 'Inter', sans-serif;
  font-size: 10pt;
  font-weight: 300;
  color: #00C3E1;
  background: #ffffff;
  border: 1px solid #00C3E1;
  border-radius: 6px;
  padding: 4px 8px;
}

.hairline { border: none; border-top: 1px solid rgba(0,195,225,0.25); margin: 12px 0; }

.song-list { display: flex; flex-direction: column; gap: 10px; }
.song-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 12pt;
  font-weight: 300;
}
.song-meta { opacity: 0.7; }
.delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 11pt;
  font-weight: 300;
  color: #00C3E1;
  padding: 2px 6px;
}
.delete-btn:hover { opacity: 0.6; }

.back-link { margin-top: 16px; font-size: 12pt; font-weight: 300; }

@media (max-width: 600px) {
  body { padding: 24px 16px 60px; }
  .container { max-width: 100%; }
  .header .logo { font-size: 20px; }
  .track-info { font-size: 11pt; }
}
@media (min-width: 1200px) {
  body { padding: 48px 24px 60px; }
}

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="/" class="logo">whispering!</a>
    <button class="filter-btn" id="filterBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="filter-menu" id="filterMenu">
      <button id="uploadLink">upload recording</button>
    </div>
  </div>

  <div class="title-row">
    <span class="page-title">deletion page</span>
    <select class="filter-select" id="artistFilter">
      <option value="all">voices</option>
    </select>
  </div>
  <hr class="hairline">
  <div class="song-list" id="songList"></div>
  <div class="status" id="status"></div>
  <div class="back-link"><a href="/">back to whispers</a></div>
</div>

<script>
  const TOKEN = sessionStorage.getItem('whisper_token');
  if (!TOKEN) { window.location.href = '/upload/'; }
  const REPO_OWNER = 'pointy-secrets';
  const REPO_NAME = 'whispering';
  const BRANCH = 'main';
  const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  filterBtn.addEventListener('click', (e) => { e.stopPropagation(); filterMenu.classList.toggle('open'); });
  document.addEventListener('click', () => filterMenu.classList.remove('open'));
  filterMenu.addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('uploadLink').addEventListener('click', () => { window.location.href = '/upload/'; });

  const songListEl = document.getElementById('songList');
  const statusEl = document.getElementById('status');
  const artistFilter = document.getElementById('artistFilter');
  let allSongs = [];
  let songsSha = null;

  function toBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

  async function loadSongs() {
    try {
      const res = await fetch(`${API}/_data/songs.json`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
      if (!res.ok) throw new Error('failed to fetch');
      const data = await res.json();
      songsSha = data.sha;
      allSongs = JSON.parse(atob(data.content));
      populateFilter();
      renderSongs();
    } catch (e) {
      statusEl.textContent = 'could not load: ' + e.message;
    }
  }

  function populateFilter() {
    const artists = [...new Set(allSongs.map(s => s.artist || s.user))].sort();
    artistFilter.innerHTML = '<option value="all">voices</option>';
    artists.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      artistFilter.appendChild(opt);
    });
  }

  function renderSongs() {
    const filter = artistFilter.value;
    const filtered = filter === 'all' ? allSongs : allSongs.filter(s => (s.artist || s.user) === filter);
    songListEl.innerHTML = '';
    filtered.forEach((song, idx) => {
      const item = document.createElement('div');
      item.className = 'song-item';
      const meta = document.createElement('span');
      meta.className = 'song-meta';
      meta.textContent = `${song.title || song.name} — ${song.artist || song.user}`;
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.addEventListener('click', () => deleteSong(idx, song));
      item.appendChild(meta);
      item.appendChild(del);
      songListEl.appendChild(item);
    });
  }

  artistFilter.addEventListener('change', renderSongs);

  async function deleteSong(idx, song) {
    if (!confirm(`delete "${song.title || song.name}"?`)) return;
    try {
      statusEl.textContent = 'deleting...';
      const path = (song.src || '').replace(/^\//, '');
      if (path) {
        const fileRes = await fetch(`${API}/${path}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          await fetch(`${API}/${path}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'delete audio', sha: fileData.sha, branch: BRANCH })
          });
        }
      }
      allSongs.splice(idx, 1);
      const newContent = toBase64(JSON.stringify(allSongs, null, 2));
      const jsonRes = await fetch(`${API}/_data/songs.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'remove from list', content: newContent, sha: songsSha, branch: BRANCH })
      });
      if (!jsonRes.ok) throw new Error('failed to update list');
      const jsonData = await jsonRes.json();
      songsSha = jsonData.sha;
      statusEl.textContent = 'deleted';
      populateFilter();
      renderSongs();
    } catch (e) {
      statusEl.textContent = 'delete failed: ' + e.message;
    }
  }

  loadSongs();
</script>
</body>
</html>
