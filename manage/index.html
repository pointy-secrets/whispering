<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>manage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #00C3E1;
    font-family: 'Inter', sans-serif;
    font-size: 12pt;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  a { color: #00C3E1; text-decoration: none; }
  a:hover { opacity: 0.7; }

  .container { width: 100%; max-width: 360px; }

  .header {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    font-size: 11px;
    color: #00C3E1;
    width: 100%;
    justify-content: space-between;
  }
  .header a { font-size: 11px; color: #00C3E1; }
  .site-logo {
    font-style: italic;
    font-weight: 400;
    font-size: 12pt;
    line-height: 1.5;
    color: #00C3E1;
    text-decoration: none;
  }
  .header .active { font-weight: 700; }

  .page-title {
    font-size: 18px;
    font-weight: 700;
    color: #00C3E1;
    text-align: left;
    margin-bottom: 2px;
    letter-spacing: -0.02em;
  }

  .intro-text {
    font-size: 11px;
    color: #00C3E1;
    opacity: 0.7;
    text-align: left;
    margin-bottom: 20px;
    line-height: 1.4;
  }

    /* filter dropdown */
  .filter-wrap {
    position: relative;
    margin-bottom: 24px;
  }
  .filter-wrap select {
    width: 100%;
    padding: 8px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    background: #f0fafc;
    border: 1px solid #00C3E1;
    border-radius: 6px;
    color: #00C3E1;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    outline: none;
  }
  .filter-wrap::after {
    content: "\25BE";
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    color: #00C3E1;
    pointer-events: none;
  }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .track {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .track-info {
    font-size: 11px;
    line-height: 1.4;
    color: #00C3E1;
  }

  .track-title { font-weight: 500; }
  .track-artist { opacity: 0.7; }

  .delete-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1px solid #00C3E1;
    border-radius: 4px;
    background: #fff;
    color: #00C3E1;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .delete-btn:hover { background: #00C3E1; color: #fff; }


  /* responsive */
  @media (max-width: 420px) {
    .container { padding: 0; max-width: 100%; }
    body { padding: 24px 24px 60px; font-size: 12pt; }
    .page-title { font-size: 12pt; }
    .header a { font-size: 12pt; }
  }
  @media (min-width: 768px) {
    .container { max-width: 720px; }
    body { padding: 40px 16px 60px; }
    .page-title { font-size: 20px; }
  }
  @media (min-width: 1200px) {
    .container { max-width: 100%; }
    .site-logo { font-size: 12pt; }
    body { padding: 48px 24px 60px; font-size: 12pt; }
    .page-title { font-size: 12pt; }
  }
  #status {
    margin-top: 16px;
    font-size: 11px;
    color: #00C3E1;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="/" class="site-logo">whispering!</a>
  </div>
  <h1 class="page-title">Deletion Page</h1>


  <div class="filter-wrap">
    <select id="artistFilter">
      <option value="all">voices</option>
    </select>
  </div>

  <div class="track-list" id="trackList"></div>
  <div id="status"></div>
</div>

<script>
const OWNER = 'pointy-secrets';
const REPO = 'whispering';
const SONGS_PATH = '_data/songs.json';
const TOKEN = sessionStorage.getItem('whisper_token') || '';

if (!sessionStorage.getItem('whisper_token')) { window.location.href = '/upload/'; }
const list = document.getElementById('trackList');
const statusEl = document.getElementById('status');
const filterSelect = document.getElementById('artistFilter');
let allTracks = [];

async function fetchSongs() {
  const resp = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + SONGS_PATH, {
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json' }
  });
  if (!resp.ok) throw new Error('Failed to fetch');
  const data = await resp.json();
  return JSON.parse(atob(data.content));
}

function renderList(filter) {
  list.innerHTML = '';
  const tracks = filter === 'all' ? allTracks : allTracks.filter(t => (t.artist || t.user) === filter);
  tracks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'track';

    const info = document.createElement('div');
    info.className = 'track-info';
    info.innerHTML = '<span class="track-title">' + (t.title || t.name) + '</span> <span class="track-artist">' + (t.artist || t.user) + '</span>';

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = '\u00D7';
    del.title = 'delete';
    del.addEventListener('click', () => deleteTrack(t));

    row.appendChild(info);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function buildFilter() {
  filterSelect.innerHTML = '<option value="all">voices</option>';
  const artists = [...new Set(allTracks.map(t => t.artist || t.user))].sort();
  artists.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    filterSelect.appendChild(opt);
  });
}

filterSelect.addEventListener('change', () => renderList(filterSelect.value));

async function deleteTrack(track) {
  if (!confirm('Delete "' + (track.title || track.name) + '" by ' + (track.artist || track.user) + '?')) return;

  statusEl.textContent = 'deleting...';
  const idx = allTracks.indexOf(track);
  if (idx > -1) allTracks.splice(idx, 1);

  try {
    const songsStr = JSON.stringify(allTracks, null, 2);
    const songsB64 = btoa(unescape(encodeURIComponent(songsStr)));

    const songResp = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + SONGS_PATH, {
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json' }
    });
    const songData = await songResp.json();

    const resp = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + SONGS_PATH, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({
        message: 'delete "' + (track.title || track.name) + '"',
        content: songsB64,
        sha: songData.sha
      })
    });

    if (!resp.ok) throw new Error('Delete failed');

    buildFilter();
    renderList(filterSelect.value);
    statusEl.textContent = 'deleted - whispering updates in ~1 min';
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
    // Re-fetch to restore state
    allTracks = await fetchSongs();
    renderList(filterSelect.value);
  }
}

fetchSongs()
  .then(songs => { allTracks = songs || []; buildFilter(); renderList('all'); })
  .catch(err => { statusEl.textContent = 'error: ' + err.message; });
</script>
</body>
</html>
